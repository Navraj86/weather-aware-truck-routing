# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: weather-aware-truck-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      # Optional: a commercial Open-Meteo key lifts the free-tier rate limits.
      - key: OPEN_METEO_API_KEY
        sync: false
